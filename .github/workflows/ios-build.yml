name: iOS Build

on:
  push:
    branches:
      - feature/ios-parent-dashboard
      - feature/ios-*
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
concurrency:
  group: ios-build-${{ (github.head_ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate branded iOS App Store icon
        run: |
          swift ios/scripts/generate_app_icon.swift ios/OilaNazoratiIOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png 1024

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS app and Screen Time extensions
        run: |
          xcodebuild \
            -project ios/OilaNazorati.xcodeproj \
            -scheme OilaNazoratiIOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release configuration for physical iOS devices
        run: |
          xcodebuild \
            -project ios/OilaNazorati.xcodeproj \
            -scheme OilaNazoratiIOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
