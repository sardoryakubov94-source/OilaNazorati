name: Add Android requirement notice

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add notice stylesheet to main page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<link rel="stylesheet" href="notice.css">'
          if tag not in s:
              s = s.replace('</head>', tag + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Android device requirement notice to main site"
          git push
