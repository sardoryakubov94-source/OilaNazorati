name: Ensure Screenshot Permission

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure screenshot permission integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          p = Path('app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt')
          s = p.read_text()
          original = s

          if 'binding.btnScreenCapture.setOnClickListener' not in s:
              pattern = r'(\s*binding\.btnUsageAccess\.setOnClickListener\s*\{\s*\n\s*startActivity\(Intent\(Settings\.ACTION_USAGE_ACCESS_SETTINGS\)\)\s*\n\s*\}\s*)'
              m = re.search(pattern, s)
              if not m:
                  raise SystemExit('Could not find usage-access listener in ChildSetupActivity.kt')
              addition = '\n        binding.btnScreenCapture.setOnClickListener {\n            requestScreenCaptureConsent()\n        }\n'
              s = s[:m.end()] + addition + s[m.end():]

          if 'private fun requestScreenCaptureConsent()' not in s:
              marker = "    // ---------------- Oila kodi bilan bog'lash ----------------"
              if marker not in s:
                  raise SystemExit('Could not find pairing section marker')
              method = '''    private fun requestScreenCaptureConsent() {\n        startActivity(Intent(this, ScreenCaptureConsentActivity::class.java))\n    }\n\n'''
              s = s.replace(marker, method + marker, 1)

          if 'screen_capture_consented' not in s:
              marker = '        updateRoleStatusUi()\n        updateDeviceAdminStatusUi()'
              if marker not in s:
                  raise SystemExit('Could not find onResume status marker')
              addition = '''\n\n        val screenCaptureConsented = getSharedPreferences("oila_nazorati", Context.MODE_PRIVATE)\n            .getBoolean("screen_capture_consented", false)\n        binding.btnScreenCapture.text = if (screenCaptureConsented) {\n            "✅ Ekran nazorati ruxsati berilgan"\n        } else {\n            "📸 Ekran tasviriga ruxsat berish"\n        }'''
              s = s.replace(marker, marker + addition, 1)

          required = [
              'binding.btnScreenCapture.setOnClickListener',
              'private fun requestScreenCaptureConsent()',
              'ScreenCaptureConsentActivity'
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('Missing screenshot integration: ' + item)

          if s != original:
              p.write_text(s)
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', str(p)], check=True)
              subprocess.run(['git', 'commit', '-m', 'fix: integrate screenshot permission into child setup'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
              print('Screenshot permission integration committed and pushed.')
          else:
              print('Screenshot permission integration already present; nothing to commit.')
          PY
