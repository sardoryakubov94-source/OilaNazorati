name: Fix screenshot MediaProjection OFF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: stop MediaProjection when screenshot permission is disabled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch screenshot service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/uz/oilanazorati/parentcontrol/screenshot/ScreenCaptureService.kt')
          s = p.read_text()
          original = s

          old = 'settingsListener = ScreenshotRepository.listenSettings { settings = it }'
          new = '''settingsListener = ScreenshotRepository.listenSettings { newSettings ->
              settings = newSettings
              if (!newSettings.enabled) {
                  disableProjectionImmediately()
              }
          }'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''requestListener = ScreenshotRepository.listenScreenshotRequests { requestId ->
              if (projection == null) {
                  waitingRemoteRequestId = requestId
              } else {
                  queueRemoteCapture(requestId)
              }
          }'''
          new = '''requestListener = ScreenshotRepository.listenScreenshotRequests { requestId ->
              if (!settings.enabled) {
                  ScreenshotRepository.markScreenshotRequest(requestId, "failed", "Screenshot olish o'chirilgan")
              } else if (projection == null) {
                  waitingRemoteRequestId = requestId
              } else {
                  queueRemoteCapture(requestId)
              }
          }'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''if (projection == null && intent != null) {
            val code = intent.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)'''
          new = '''if (projection == null && intent != null && settings.enabled) {
            val code = intent.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''private fun startProjection(resultCode: Int, data: Intent) {
        val crashlytics'''
          new = '''private fun startProjection(resultCode: Int, data: Intent) {
        if (!settings.enabled) {
            ScreenshotRepository.updateProjectionStatus(false)
            return
        }
        val crashlytics'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''private fun queueRemoteCapture(requestId: String) {
        if (pending != null || captureInProgress || projection == null) return'''
          new = '''private fun queueRemoteCapture(requestId: String) {
        if (!settings.enabled) {
            ScreenshotRepository.markScreenshotRequest(requestId, "failed", "Screenshot olish o'chirilgan")
            return
        }
        if (pending != null || captureInProgress || projection == null) return'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''private fun cleanupProjection() {
        cancelPendingCaptureWatch()'''
          new = '''private fun disableProjectionImmediately() {
        cancelPendingCaptureWatch()
        pending = null
        captureInProgress = false
        waitingRemoteRequestId = null

        val activeProjection = projection
        projection = null
        virtualDisplay?.release()
        virtualDisplay = null
        imageReader?.close()
        imageReader = null
        if (hasLiveProjection) ScreenshotRepository.updateProjectionStatus(false)
        hasLiveProjection = false

        // MediaProjectionning o'zi ham to'xtatiladi. Keyingi yoqishda yangi
        // foydalanuvchi consent'i talab qilinadi; eski sessiya qayta ishlatilmaydi.
        try { activeProjection?.stop() } catch (_: Throwable) { }
    }

    private fun cleanupProjection() {
        cancelPendingCaptureWatch()'''
          if old in s:
              s = s.replace(old, new, 1)

          required = [
              'disableProjectionImmediately()',
              'if (!settings.enabled) {\n            ScreenshotRepository.updateProjectionStatus(false)\n            return\n        }',
              'ScreenshotRepository.markScreenshotRequest(requestId, "failed", "Screenshot olish o\'chirilgan")'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Patch incomplete: ' + repr(missing))

          if s != original:
              p.write_text(s)
              print('MediaProjection OFF patch applied.')
          else:
              print('Patch already applied.')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/uz/oilanazorati/parentcontrol/screenshot/ScreenCaptureService.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: stop MediaProjection when screenshot permission is disabled"
            git push origin HEAD:main
          fi
