name: Patch child screenshot permission

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: show screenshot permission in child setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate screenshot permission button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt')
          s = p.read_text()
          original = s

          if 'binding.btnScreenCapture.setOnClickListener' not in s:
              pattern = r'(\s*binding\.btnUsageAccess\.setOnClickListener\s*\{\s*\n\s*startActivity\(Intent\(Settings\.ACTION_USAGE_ACCESS_SETTINGS\)\)\s*\n\s*\}\s*)'
              m = re.search(pattern, s)
              if not m:
                  raise SystemExit('usage-access listener not found')
              s = s[:m.end()] + '\n        binding.btnScreenCapture.setOnClickListener {\n            requestScreenCaptureConsent()\n        }\n' + s[m.end():]

          if 'private fun requestScreenCaptureConsent()' not in s:
              marker = "    // ---------------- Oila kodi bilan bog'lash ----------------"
              if marker not in s:
                  raise SystemExit('pairing marker not found')
              method = '''    private fun requestScreenCaptureConsent() {\n        startActivity(Intent(this, ScreenCaptureConsentActivity::class.java))\n    }\n\n'''
              s = s.replace(marker, method + marker, 1)

          if 'screen_capture_consented' not in s:
              marker = '        updateRoleStatusUi()\n        updateDeviceAdminStatusUi()'
              if marker not in s:
                  raise SystemExit('onResume marker not found')
              addition = '''\n\n        val screenCaptureConsented = getSharedPreferences("oila_nazorati", Context.MODE_PRIVATE)\n            .getBoolean("screen_capture_consented", false)\n        binding.btnScreenCapture.text = if (screenCaptureConsented) {\n            "✅ Ekran nazorati ruxsati berilgan"\n        } else {\n            "📸 Ekran tasviriga ruxsat berish"\n        }'''
              s = s.replace(marker, marker + addition, 1)

          required = [
              'binding.btnScreenCapture.setOnClickListener',
              'private fun requestScreenCaptureConsent()',
              'ScreenCaptureConsentActivity'
          ]
          for item in required:
              if item not in s:
                  raise SystemExit('missing: ' + item)

          if s == original:
              print('Screenshot integration already present; no source change needed.')
          else:
              p.write_text(s)
              print('Screenshot integration patched.')
          PY
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: show screenshot permission in child setup"
            git push origin HEAD:main
          fi
