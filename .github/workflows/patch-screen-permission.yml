name: Patch child screenshot permission

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: show screenshot permission in child setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate screenshot permission button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt')
          s = p.read_text()
          old = '''        binding.btnUsageAccess.setOnClickListener {
            startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
        }
        binding.btnDefaultPhone.setOnClickListener { requestDefaultPhoneRole() }'''
          new = '''        binding.btnUsageAccess.setOnClickListener {
            startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
        }
        binding.btnScreenCapture.setOnClickListener {
            requestScreenCaptureConsent()
        }
        binding.btnDefaultPhone.setOnClickListener { requestDefaultPhoneRole() }'''
          if old not in s:
              raise SystemExit('expected setup listener block not found')
          s = s.replace(old, new, 1)

          old = '''        binding.btnBatteryOptimization.text = if (pm.isIgnoringBatteryOptimizations(packageName)) {
            "✅ Batareya tejashdan chiqarilgan"
        } else {
            "🔋 Batareya tejashdan chiqarish (muhim!)"
        }
    }

    // ---------------- Oila kodi bilan bog'lash ----------------'''
          new = '''        binding.btnBatteryOptimization.text = if (pm.isIgnoringBatteryOptimizations(packageName)) {
            "✅ Batareya tejashdan chiqarilgan"
        } else {
            "🔋 Batareya tejashdan chiqarish (muhim!)"
        }

        val screenCaptureConsented = getSharedPreferences("oila_nazorati", Context.MODE_PRIVATE)
            .getBoolean("screen_capture_consented", false)
        binding.btnScreenCapture.text = if (screenCaptureConsented) {
            "✅ Ekran nazorati ruxsati berilgan"
        } else {
            "📸 Ekran tasviriga ruxsat berish"
        }
    }

    private fun requestScreenCaptureConsent() {
        startActivity(Intent(this, ScreenCaptureConsentActivity::class.java))
    }

    // ---------------- Oila kodi bilan bog'lash ----------------'''
          if old not in s:
              raise SystemExit('expected onResume block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt
          git commit -m "fix: show screenshot permission in child setup"
          git push origin HEAD:main
      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/patch-screen-permission.yml
          git commit -m "chore: remove temporary screenshot patch workflow"
          git push origin HEAD:main
