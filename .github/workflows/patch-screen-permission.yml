name: Patch child screenshot permission

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: show screenshot permission in child setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate screenshot permission button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt')
          s = p.read_text()
          original = s

          if 'binding.btnScreenCapture.setOnClickListener' not in s:
              lines = s.splitlines(keepends=True)
              idx = next((i for i, line in enumerate(lines) if 'binding.btnUsageAccess.setOnClickListener' in line), None)
              if idx is None:
                  raise SystemExit('usage access listener line not found')
              end = next((i for i in range(idx + 1, len(lines)) if lines[i].strip() == '}'), None)
              if end is None:
                  raise SystemExit('usage access listener closing brace not found')
              lines[end + 1:end + 1] = [
                  '        binding.btnScreenCapture.setOnClickListener {\n',
                  '            requestScreenCaptureConsent()\n',
                  '        }\n'
              ]
              s = ''.join(lines)

          if 'private fun requestScreenCaptureConsent()' not in s:
              marker = "    // ---------------- Oila kodi bilan bog'lash ----------------"
              if marker not in s:
                  raise SystemExit('pairing marker not found')
              method = '    private fun requestScreenCaptureConsent() {\n        startActivity(Intent(this, ScreenCaptureConsentActivity::class.java))\n    }\n\n'
              s = s.replace(marker, method + marker, 1)

          if s != original:
              p.write_text(s)
              print('Screenshot integration patched.')
          else:
              print('Screenshot integration already present.')

          for item in ['binding.btnScreenCapture.setOnClickListener', 'private fun requestScreenCaptureConsent()', 'ScreenCaptureConsentActivity']:
              if item not in s:
                  raise SystemExit('missing: ' + item)
          PY
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: show screenshot permission in child setup"
            git push origin HEAD:main
          fi
