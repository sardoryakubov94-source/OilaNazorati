name: Build Release APK

on:
  push:
    branches: [ main, master, screenshot-feature ]
  workflow_dispatch:

# Release APK build workflow
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle 8.5 o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: google-services.json faylini yaratish
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo "GOOGLE_SERVICES_JSON_B64 secret topilmadi"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Google Web OAuth client ID resursini tayyorlash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('app/google-services.json').read_text())
          client_id = None
          for client in data.get('client', []):
              for oauth in client.get('oauth_client', []):
                  if oauth.get('client_type') == 3 and oauth.get('client_id'):
                      client_id = oauth['client_id']
                      break
              if client_id:
                  break
          if not client_id:
              raise SystemExit('Firebase google-services.json ichida Web OAuth client (client_type=3) topilmadi. Google Sign-In uchun Firebase Authentication > Google provider va Web client sozlanishi kerak.')
          out = Path('app/src/main/res/values/google_auth.xml')
          out.parent.mkdir(parents=True, exist_ok=True)
          escaped = client_id.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&apos;')
          out.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="default_web_client_id" translatable="false">' + escaped + '</string>\n</resources>\n')
          print('Google Web OAuth client ID resursi tayyorlandi')
          PY

      - name: Release keystore'ni tiklash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret topilmadi"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Release signing sozlamalarini tekshirish
        env:
          OILA_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          OILA_KEYSTORE_PASSWORD: ${{ secrets.OILA_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          OILA_KEY_ALIAS: ${{ secrets.OILA_KEY_ALIAS || secrets.KEY_ALIAS }}
          OILA_KEY_PASSWORD: ${{ secrets.OILA_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          test -s "$OILA_KEYSTORE_PATH" || { echo "Keystore bo'sh yoki topilmadi"; exit 1; }
          test -n "$OILA_KEYSTORE_PASSWORD" || { echo "Keystore paroli Secret topilmadi"; exit 1; }
          test -n "$OILA_KEY_ALIAS" || { echo "Keystore alias Secret topilmadi"; exit 1; }
          test -n "$OILA_KEY_PASSWORD" || { echo "Key paroli Secret topilmadi"; exit 1; }

      - name: Release APK build
        env:
          OILA_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          OILA_KEYSTORE_PASSWORD: ${{ secrets.OILA_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          OILA_KEY_ALIAS: ${{ secrets.OILA_KEY_ALIAS || secrets.KEY_ALIAS }}
          OILA_KEY_PASSWORD: ${{ secrets.OILA_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease

      - name: APK nomini tayyorlash
        run: |
          cp app/build/outputs/apk/release/app-release.apk OilaNazorati-v1.0.1-release.apk
          sha256sum OilaNazorati-v1.0.1-release.apk > OilaNazorati-v1.0.1-release.apk.sha256

      - name: APKni saytning downloads papkasiga joylash
        if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[website-apk]') }}
        run: |
          mkdir -p downloads
          cp OilaNazorati-v1.0.1-release.apk downloads/oila-nazorati.apk
          cp OilaNazorati-v1.0.1-release.apk.sha256 downloads/oila-nazorati.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/oila-nazorati.apk downloads/oila-nazorati.apk.sha256
          if git diff --cached --quiet; then
            echo "Website APK allaqachon eng yangi holatda."
          else
            git commit -m "chore: publish website APK [website-apk]"
            git push
          fi

      - name: Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OilaNazorati-release-v1.0.1
          path: |
            OilaNazorati-v1.0.1-release.apk
            OilaNazorati-v1.0.1-release.apk.sha256
          retention-days: 30
