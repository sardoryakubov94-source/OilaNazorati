name: Deploy Oila Nazorati website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ios.html'
      - 'site.css'
      - 'notice.css'
      - 'privacy.html'
      - 'downloads/**'
      - 'panel.html'
      - 'screenshot-request.js'
      - 'sim-panel.js'
      - 'mic-request.js'
      - 'mic-webrtc.js'
      - 'ios-panel.css'
      - 'manifest.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  # MUHIM: "Build Release APK" workflow yangi APK'ni downloads/ papkasiga
  # avtomatik commit qilib push qiladi, LEKIN buni GITHUB_TOKEN orqali
  # qiladi — GitHub xavfsizlik siyosati bo'yicha shu turdagi push'lar
  # boshqa workflow'larni (jumladan shu "push" trigger'ini) ISHGA
  # TUSHIRMAYDI (cheksiz tsiklning oldini olish uchun). Natijada sayt
  # yangi APK bilan avtomatik yangilanmay qolardi. Shu sabab bu yerga
  # alohida workflow_run trigger qo'shildi — build tugashi bilanoq sayt
  # ham qayta deploy qilinadi.
  workflow_run:
    workflows: ["Build Release APK"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MUHIM: workflow_run orqali kelganda github.event.workflow_run.head_sha
          # "Build Release APK"ni ISHGA TUSHIRGAN commit (masalan merge commit),
          # lekin APK downloads/ ga o'sha run ICHIDA, UNDAN KEYIN alohida commit
          # sifatida push qilinadi. Shu sabab bu yerda aynan "main" ko'rsatiladi —
          # bu paytda yangi APK commit'i allaqachon main'ga tushib bo'lgan bo'ladi.
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare standalone site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html ios.html site.css notice.css privacy.html panel.html screenshot-request.js sim-panel.js mic-request.js mic-webrtc.js ios-panel.css manifest.json manifest.webmanifest sw.js _site/
          if [ -d downloads ]; then cp -R downloads _site/downloads; fi
          if [ -d icons ]; then cp -R icons _site/icons; fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
