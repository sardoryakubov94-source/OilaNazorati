name: Deploy Oila Nazorati website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ios.html'
      - 'site.css'
      - 'notice.css'
      - 'privacy.html'
      - 'downloads/**'
      - 'panel.html'
      - 'manifest.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare standalone site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html ios.html site.css notice.css privacy.html panel.html manifest.json manifest.webmanifest sw.js _site/
          if [ -d downloads ]; then cp -R downloads _site/downloads; fi
          if [ -d icons ]; then cp -R icons _site/icons; fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
