name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo "GOOGLE_SERVICES_JSON_B64 secret topilmadi"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle --no-daemon assembleDebug 2>&1 | tee /tmp/build_output.log

      - name: Save build log on failure (temporary diagnostics)
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p ci-logs
          tail -n 400 /tmp/build_output.log > ci-logs/last-build-error.txt
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "CI Bot"
          git add -f ci-logs/last-build-error.txt
          git commit -m "ci: capture build failure log [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OilaNazorati-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
