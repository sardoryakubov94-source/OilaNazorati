name: Fix Parent Location Button

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-location:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ota-ona joylashuv ruxsatini tuzatish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/uz/oilanazorati/parentcontrol/ui/LocationHistoryActivity.kt')
          s = p.read_text()
          s = s.replace(
              'import android.content.pm.PackageManager\n',
              'import android.content.pm.PackageManager\n'
          )
          s = s.replace(
              '    private val locationPermissionLauncher = registerForActivityResult(\n        ActivityResultContracts.RequestPermission()\n    ) { granted ->\n        if (granted) enableMyLocationOnMap()\n    }',
              '''    private val locationPermissionLauncher = registerForActivityResult(\n        ActivityResultContracts.RequestMultiplePermissions()\n    ) { result ->\n        if (result[android.Manifest.permission.ACCESS_FINE_LOCATION] == true ||\n            result[android.Manifest.permission.ACCESS_COARSE_LOCATION] == true) {\n            enableMyLocationOnMap()\n        }\n    }'''
          )
          s = s.replace(
              '''        val granted = ContextCompat.checkSelfPermission(\n            this, android.Manifest.permission.ACCESS_FINE_LOCATION\n        ) == PackageManager.PERMISSION_GRANTED\n        if (granted) {\n            enableMyLocationOnMap()\n        } else {\n            locationPermissionLauncher.launch(android.Manifest.permission.ACCESS_FINE_LOCATION)\n        }''',
              '''        val fineGranted = ContextCompat.checkSelfPermission(\n            this, android.Manifest.permission.ACCESS_FINE_LOCATION\n        ) == PackageManager.PERMISSION_GRANTED\n        val coarseGranted = ContextCompat.checkSelfPermission(\n            this, android.Manifest.permission.ACCESS_COARSE_LOCATION\n        ) == PackageManager.PERMISSION_GRANTED\n\n        if (fineGranted || coarseGranted) {\n            enableMyLocationOnMap()\n        } else {\n            locationPermissionLauncher.launch(\n                arrayOf(\n                    android.Manifest.permission.ACCESS_FINE_LOCATION,\n                    android.Manifest.permission.ACCESS_COARSE_LOCATION\n                )\n            )\n        }'''
          )
          s = s.replace(
              '''        val granted = ContextCompat.checkSelfPermission(\n            this, android.Manifest.permission.ACCESS_FINE_LOCATION\n        ) == PackageManager.PERMISSION_GRANTED\n        if (!granted) return\n        googleMap?.isMyLocationEnabled = true\n        googleMap?.uiSettings?.isMyLocationButtonEnabled = true''',
              '''        val fineGranted = ContextCompat.checkSelfPermission(\n            this, android.Manifest.permission.ACCESS_FINE_LOCATION\n        ) == PackageManager.PERMISSION_GRANTED\n        val coarseGranted = ContextCompat.checkSelfPermission(\n            this, android.Manifest.permission.ACCESS_COARSE_LOCATION\n        ) == PackageManager.PERMISSION_GRANTED\n        if (!fineGranted && !coarseGranted) return\n        googleMap?.isMyLocationEnabled = true\n        googleMap?.uiSettings?.isMyLocationButtonEnabled = true'''
          )
          p.write_text(s)
          PY

      - name: Screenshot integratsiyasini tiklash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt')
          s = p.read_text()
          if 'binding.btnScreenCapture.setOnClickListener' not in s:
              marker = '        binding.btnUsageAccess.setOnClickListener {'
              start = s.find(marker)
              if start < 0: raise SystemExit('Usage access listener topilmadi')
              end = s.find('        }', start)
              if end < 0: raise SystemExit('Usage access listener yopilishi topilmadi')
              end += len('        }')
              s = s[:end] + '\n        binding.btnScreenCapture.setOnClickListener {\n            requestScreenCaptureConsent()\n        }' + s[end:]
          if 'private fun requestScreenCaptureConsent()' not in s:
              marker = "    // ---------------- Oila kodi bilan bog'lash ----------------"
              if marker not in s: raise SystemExit('Pairing marker topilmadi')
              method = '    private fun requestScreenCaptureConsent() {\n        startActivity(Intent(this, ScreenCaptureConsentActivity::class.java))\n    }\n\n'
              s = s.replace(marker, method + marker, 1)
          p.write_text(s)
          PY

      - name: Screenshot integratsiyasini tekshirish
        run: |
          grep -q 'binding.btnScreenCapture.setOnClickListener' app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt
          grep -q 'private fun requestScreenCaptureConsent' app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt
          grep -q 'btnScreenCapture' app/src/main/res/layout/activity_child_setup.xml
          test -f app/src/main/java/uz/oilanazorati/parentcontrol/ui/ScreenCaptureConsentActivity.kt

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle 8.5 o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: google-services.json faylini yaratish
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64"
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Google Web OAuth client ID resursini tayyorlash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('app/google-services.json').read_text())
          client_id = next((o.get('client_id') for c in data.get('client', []) for o in c.get('oauth_client', []) if o.get('client_type') == 3 and o.get('client_id')), None)
          if not client_id: raise SystemExit('Web OAuth client topilmadi')
          out = Path('app/src/main/res/values/google_auth.xml')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<string name="default_web_client_id" translatable="false">' + client_id + '</string>\n</resources>\n')
          PY

      - name: Release keystore'ni tiklash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Release APK build
        env:
          OILA_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          OILA_KEYSTORE_PASSWORD: ${{ secrets.OILA_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          OILA_KEY_ALIAS: ${{ secrets.OILA_KEY_ALIAS || secrets.KEY_ALIAS }}
          OILA_KEY_PASSWORD: ${{ secrets.OILA_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: APKni saytga joylash va commit qilish
        run: |
          cp app/build/outputs/apk/release/app-release.apk OilaNazorati-v1.0.1-release.apk
          sha256sum OilaNazorati-v1.0.1-release.apk > OilaNazorati-v1.0.1-release.apk.sha256
          mkdir -p downloads
          cp OilaNazorati-v1.0.1-release.apk downloads/oila-nazorati.apk
          cp OilaNazorati-v1.0.1-release.apk.sha256 downloads/oila-nazorati.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/uz/oilanazorati/parentcontrol/ui/ChildSetupActivity.kt downloads/oila-nazorati.apk downloads/oila-nazorati.apk.sha256
          git add app/src/main/java/uz/oilanazorati/parentcontrol/ui/LocationHistoryActivity.kt
          git commit -m 'fix: restore working APK and screenshot permission' || true
          git push origin HEAD:main

      - name: Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OilaNazorati-working-release
          path: |
            OilaNazorati-v1.0.1-release.apk
            OilaNazorati-v1.0.1-release.apk.sha256
          retention-days: 30
