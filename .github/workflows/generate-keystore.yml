name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Keystore yaratish
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias oila_nazorati \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass OilaNazorati2026 \
            -keypass OilaNazorati2026 \
            -dname "CN=Oila Nazorati, OU=Dev, O=OilaNazorati, L=Tashkent, S=Tashkent, C=UZ"

      - name: Base64 formatga o'tkazish
        run: base64 -w 0 release.keystore > release.keystore.b64

      - name: SHA-1 va SHA-256 kalitlarini chiqarish
        run: keytool -list -v -keystore release.keystore -alias oila_nazorati -storepass OilaNazorati2026

      - name: Natijalarni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            release.keystore
            release.keystore.b64
