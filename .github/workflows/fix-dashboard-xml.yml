name: Fix Dashboard XML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('app/src/main/res/layout/activity_parent_dashboard.xml')
          print('Dashboard XML is valid')
          PY
