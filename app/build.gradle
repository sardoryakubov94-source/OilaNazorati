plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'uz.oilanazorati.parentcontrol'
    compileSdk 34

    defaultConfig {
        applicationId "uz.oilanazorati.parentcontrol"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    // Release signing is supplied locally/through CI environment variables.
    // Never store keystore passwords or the keystore itself in GitHub.
    def keystorePath = System.getenv("OILA_KEYSTORE_PATH")
    def keystorePassword = System.getenv("OILA_KEYSTORE_PASSWORD")
    def keyAliasValue = System.getenv("OILA_KEY_ALIAS")
    def keyPasswordValue = System.getenv("OILA_KEY_PASSWORD")

    signingConfigs {
        if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            // Keep minification off for this release to avoid changing monitoring behavior.
            minifyEnabled false
            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Debug builds use the normal Android debug signing key.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Grafik (statistikani chizish uchun)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
