plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'uz.oilanazorati.parentcontrol'
    compileSdk 34

    defaultConfig {
        applicationId "uz.oilanazorati.parentcontrol"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
        buildConfigField "String", "BUILD_TAG", "\"${new Date().format('MM-dd HH:mm')}\""
        // App UI itself has no i18n system (all strings are hardcoded Uzbek in
        // code/layouts — no values-XX folders of our own). Everything else
        // shipped for ~60 other languages comes from bundled dependencies
        // (Play Services, Firebase, AndroidX, Material, WebRTC) and is never
        // shown, since the app never switches locale. Keeping only en/ru
        // (ru covers devices set to Russian, common in this market) drops
        // that dead weight with no visible effect on any feature.
        resourceConfigurations += ['en', 'ru']
    }

    // Release signing is supplied locally/through CI environment variables.
    // Never store keystore passwords or the keystore itself in GitHub.
    def keystorePath = System.getenv("OILA_KEYSTORE_PATH")
    def keystorePassword = System.getenv("OILA_KEYSTORE_PASSWORD")
    def keyAliasValue = System.getenv("OILA_KEY_ALIAS")
    def keyPasswordValue = System.getenv("OILA_KEY_PASSWORD")

    signingConfigs {
        if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                signingConfig signingConfigs.release
            }
            // Native symbol upload requires an NDK/CMake build task Gradle can infer
            // unstrippedNativeLibsDir from. This project only consumes a prebuilt
            // WebRTC AAR (no native build step of our own), so that can't be
            // inferred and uploadEnabled=true fails configuration. Crash capture
            // via firebase-crashlytics-ndk still works with this off — reports
            // just won't have fully symbolicated native stack frames.
            firebaseCrashlytics {
                nativeSymbolUploadEnabled false
            }
        }
        debug {
            firebaseCrashlytics {
                nativeSymbolUploadEnabled false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    // Captures native (C++/WebRTC) crashes too, not just JVM exceptions —
    // needed to actually see WebRTC library crashes in Crashlytics.
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // WebRTC real-time audio transport. Firestore remains the signaling channel.
    // The original org.webrtc artifact is no longer resolvable, and the QuickBlox
    // mirror (1.0.32006, built ~2017) was causing unexplained native crashes with
    // no Java stack trace on some devices. Switched to Stream's actively maintained
    // WebRTC AAR, published on Maven Central and tracking current upstream libwebrtc.
    implementation 'io.github.webrtc-sdk:android:144.7559.09'

    // Grafik (statistikani chizish uchun)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
