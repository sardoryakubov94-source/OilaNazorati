<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" rx="42" fill="#eef0f8"/><rect x="28" y="28" width="844" height="1144" rx="34" fill="#fff"/><text x="70" y="100" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#202124">Google Play</text><text x="70" y="145" font-family="Arial,sans-serif" font-size="22" fill="#5f6368">Настройки → Play Защита</text><rect x="60" y="185" width="780" height="145" rx="22" fill="#f1f3f4"/><circle cx="115" cy="257" r="35" fill="#4285f4"/><path d="M100 257l12 12 22-27" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="175" y="245" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#202124">Вредоносные приложения</text><text x="175" y="285" font-family="Arial,sans-serif" font-size="23" fill="#5f6368">не найдены</text><rect x="60" y="365" width="780" height="180" rx="22" fill="#fff7df" stroke="#f59e0b" stroke-width="4"/><text x="95" y="420" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#8a4b00">1. Откройте Настройки</text><text x="95" y="465" font-family="Arial,sans-serif" font-size="23" fill="#8a4b00">Нажмите на значок ⚙ в правом</text><text x="95" y="500" font-family="Arial,sans-serif" font-size="23" fill="#8a4b00">верхнем углу экрана.</text><circle cx="785" cy="110" r="45" fill="#f59e0b" opacity=".25"/><path d="M785 80v60M755 110h60" stroke="#b45309" stroke-width="9" stroke-linecap="round"/><path d="M785 155L785 205" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/><path d="M770 190l15 15 15-15" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="590" width="780" height="245" rx="22" fill="#f1f3f4"/><text x="95" y="650" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#202124">2. Play Защита sozlamalarini oching</text><text x="95" y="700" font-family="Arial,sans-serif" font-size="23" fill="#5f6368">Keyingi oynada tekshirish sozlamalari</text><text x="95" y="738" font-family="Arial,sans-serif" font-size="23" fill="#5f6368">ko‘rsatiladi.</text><rect x="95" y="770" width="430" height="42" rx="21" fill="#d93025"/><text x="310" y="799" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">Sozlamalar belgisi shu yerda</text><rect x="60" y="880" width="780" height="220" rx="22" fill="#e8f0fe"/><text x="95" y="940" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#174ea6">3. Tekshirishni vaqtincha o‘chiring</text><text x="95" y="985" font-family="Arial,sans-serif" font-size="22" fill="#174ea6">Ish tugagach, xavfsizlik uchun</text><text x="95" y="1020" font-family="Arial,sans-serif" font-size="22" fill="#174ea6">Play Himoyasini qayta yoqing.</text></svg>